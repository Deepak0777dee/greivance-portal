<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Stackly Grievance Portal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="page-404">
    <div class="error-shapes">
      <div class="error-shape error-shape-1"></div>
      <div class="error-shape error-shape-2"></div>
      <div class="error-shape error-shape-3"></div>
    </div>
    <div class="error-container">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
      <div class="error-btns">
        <button type="button" onclick="history.back()" class="btn btn-outline" style="color:var(--white);border-color:rgba(255,255,255,0.2);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Go Back
        </button>
        <a href="index.html" class="btn btn-primary">
          Return to Home
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
